networks:
  traefik_public:
    external: true

services:
  portfolio:
    build:
      context: .
      args:
        # from .env next to this file
        VITE_ADMIN_UIDS: ${VITE_ADMIN_UIDS:-}
    image: portfolio
    container_name: portfolio
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      # Acepta tanto apex como www
      - "traefik.http.routers.portfolio.rule=Host(`ignaciohaffner.com`) || Host(`www.ignaciohaffner.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      # Redirect www → apex
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.ignaciohaffner\\.com/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://ignaciohaffner.com/$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.portfolio.middlewares=www-redirect"
